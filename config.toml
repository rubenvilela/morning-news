# Settings you can change without touching the code.

# Only keep articles published in the last N hours.
lookback_hours = 24

# Each [[feeds]] block is one news source. Add, remove or edit freely.
# Tested and rejected (2026-11-11): The Telegraph (blocks programs, error 402),
# Wall Street Journal world feed (dead: newest item from January 2025).

# --- Portugal ---
[[feeds]]
name = "Observador"
url = "https://observador.pt/feed/"
area = "Portugal"

[[feeds]]
name = "Público"
url = "https://feeds.feedburner.com/PublicoRSS"
area = "Portugal"

[[feeds]]
name = "RTP Notícias"
url = "https://www.rtp.pt/noticias/rss"
area = "Portugal"

[[feeds]]
name = "ECO"
url = "https://eco.sapo.pt/feed/"
area = "Portugal"

# --- World ---
[[feeds]]
name = "BBC World"
url = "https://feeds.bbci.co.uk/news/world/rss.xml"
area = "World"

[[feeds]]
